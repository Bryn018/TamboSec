name = "tambosec-bot"
main = "src/index.js"
compatibility_date = "2026-08-18"

# D1 SQLite — the bot's database (replaces repo-JSON storage)
[[d1_databases]]
binding = "DB"
database_name = "tambosec-db"
database_id = "e9fc521e-d803-4da7-8ebf-3e913bb9ee6e"

# Workers AI — free-tier LLM for plain-language finding summaries + email phishing classification
[ai]
binding = "AI"

# Cloudflare Email Routing delivers mail addressed to secops@insights.autos to this
# Worker. The Worker classifies it with Workers AI and re-sends safe mail to the
# verified destination (send_email binding target). This is the Path 2 AI Email Desk.
[[send_email]]
name = "EMAIL"
destination_address = "bolesapit@gmail.com"

# Telegram pushes updates here; the bot replies instantly (no polling).
# Hourly scheduled posture scans driven by each tenant's /schedule.
[triggers]
crons = ["7 * * * *"]

[vars]
# Authoritative CISA KEV catalog (official cisagov/kev-data GitHub mirror —
# the raw.githubusercontent host is reachable from Workers; cisa.gov itself
# blocks datacenter egress). Shape: { vulnerabilities: [...] }.
KEV_API_URL = "https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json"
# Cloudflare DNS-over-HTTPS for SPF/DMARC/MX checks (no token needed)
DOH_URL = "https://cloudflare-dns.com/dns-query"
# Threat-Scope feed Worker (live KEV/EPSS/ATT&CK reused by Path 3). Cloudflare host
# is reachable from this Worker; if unreachable at runtime we fall back to the D1 KEV cache.
THREAT_SCOPE_URL = "https://threat-scope-sync.walybewillin.workers.dev"

# Dashboard + Copilot API token (set via `wrangler secret put DASHBOARD_TOKEN`).
# Used to gate the /dashboard and /api/dashboard, /api/ask endpoints.
# DASHBOARD_TOKEN is provided as a secret, not a plain var.

# Secrets (set via `wrangler secret put`, never committed):
#   BOT_TOKEN        — Telegram bot token from @BotFather
#   TELEGRAM_SECRET  — shared secret Telegram sends in X-Telegram-Bot-Api-Secret-Token
