<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TamboSec Dashboard</title>
<style>
  :root { --bg:#0b1020; --panel:#141b2e; --ink:#e6ebf5; --muted:#8b97b0; --line:#22304d;
          --crit:#ff5c7a; --high:#ff9f43; --med:#ffd23f; --low:#4cc9f0; --ok:#38d39f; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px }
  .badge { font-size:11px; color:var(--muted); border:1px solid var(--line); padding:3px 8px; border-radius:999px }
  main { padding:22px; max-width:1100px; margin:0 auto }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px }
  .card .n { font-size:28px; font-weight:700 }
  .card .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px }
  .crit{color:var(--crit)} .high{color:var(--high)} .med{color:var(--med)} .low{color:var(--low)} .ok{color:var(--ok)}
  section { margin-bottom:24px }
  h2 { font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:0 0 10px }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase }
  tr:last-child td { border-bottom:none }
  .row { font-size:13px }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted) }
  .empty { color:var(--muted); padding:14px 4px }
  footer { color:var(--muted); font-size:12px; padding:0 22px 30px; max-width:1100px; margin:0 auto }
  code { background:#0e1530; padding:1px 5px; border-radius:5px; color:#bcd2ff }
  .controls { display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap }
  input { background:#0e1530; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 10px; font:13px inherit }
  .ask { width:100%; margin-top:8px; background:#0e1530; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px; font:13px inherit; resize:vertical; min-height:54px }
  .answer { margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; white-space:pre-wrap }
</style>
</head>
<body>
<header>
  <h1>🛡 TamboSec</h1>
  <span class="badge" id="tenant">loading…</span>
  <span class="badge" id="clock"></span>
  <span class="controls">
    <input id="tenantIn" placeholder="tenant id (tnt_real)" size="14" />
    <input id="tokenIn" placeholder="dashboard token" size="18" />
    <button id="saveBtn">Save</button>
  </span>
</header>
<main>
  <div class="grid" id="cards"></div>
  <section>
    <h2>Top findings</h2>
    <table><thead><tr><th>Severity</th><th>Finding</th><th>Source</th><th>CVE / EPSS</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody></table>
  </section>
  <section>
    <h2>Security Copilot</h2>
    <textarea id="askIn" class="ask" placeholder="Ask about this tenant's posture, e.g. 'Summarize our top critical risks'"></textarea>
    <button id="askBtn">Ask</button>
    <div id="answer" class="answer" style="display:none"></div>
  </section>
</main>
<footer>
  TamboSec Security Posture Dashboard · data pulled live from your Cloudflare D1 · powered by Workers AI.
</footer>
<script>
  // API origin = the TamboSec Worker. Override with ?api=https://... if needed.
  const API = new URLSearchParams(location.search).get('api') || 'https://tambosec-bot.walybewillin.workers.dev';
  const $ = (id) => document.getElementById(id);
  function loadState() {
    return {
      tenant: localStorage.getItem('ts_tenant') || (new URLSearchParams(location.search).get('tenant') || 'tnt_real'),
      token: localStorage.getItem('ts_token') || (new URLSearchParams(location.search).get('token') || ''),
    };
  }
  let state = loadState();
  $('tenantIn').value = state.tenant;
  $('tokenIn').value = state.token;
  function persist() {
    state.tenant = $('tenantIn').value.trim() || 'tnt_real';
    state.token = $('tokenIn').value.trim();
    localStorage.setItem('ts_tenant', state.tenant);
    localStorage.setItem('ts_token', state.token);
  }
  $('saveBtn').onclick = () => { persist(); load(); };

  async function api(path) {
    const res = await fetch(API + path + (path.includes('?') ? '&' : '?') +
      'tenantId=' + encodeURIComponent(state.tenant) + '&token=' + encodeURIComponent(state.token),
      { headers: { 'X-TamboSec-Token': state.token } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function load() {
    try {
      const d = await api('/api/dashboard');
      const t = d.tenant || {};
      $('tenant').textContent = (t.name || 'unknown') + (t.domain ? ' · ' + t.domain : '');
      $('clock').textContent = new Date().toLocaleString();
      const s = d.summary || {};
      const sc = s.sevCounts || {};
      const cards = [
        ['Total findings', s.total || 0, ''],
        ['Open', s.open || 0, ''],
        ['Critical', sc.critical || 0, 'crit'],
        ['High', sc.high || 0, 'high'],
        ['Unread alerts', s.unreadAlerts || 0, 'high'],
        ['Phishing blocked', (s.mail && s.mail.quarantined) || 0, 'ok'],
      ];
      $('cards').innerHTML = cards.map(c =>
        '<div class="card"><div class="n ' + (c[2] || '') + '">' + c[1] + '</div><div class="l">' + c[0] + '</div></div>').join('');
      const rows = (d.findings || []).map(f => {
        const sev = (f.severity || '').toLowerCase();
        const ce = (f.cve ? f.cve : '') + (f.epss != null ? ' · ' + Number(f.epss).toFixed(3) : '');
        return '<tr class="row"><td class="' + (sev === 'critical' ? 'crit' : sev === 'high' ? 'high' : sev === 'medium' ? 'med' : 'low') + '"><b>' + (f.severity || '') + '</b></td>' +
          '<td>' + escapeHtml(f.title || '') + '</td>' +
          '<td><span class="pill">' + (f.source || '') + '</span></td>' +
          '<td>' + (ce || '<span class="muted">—</span>') + '</td></tr>';
      }).join('');
      $('rows').innerHTML = rows || '<tr><td colspan="4" class="empty">No findings for this tenant.</td></tr>';
    } catch (e) {
      $('tenant').textContent = 'auth error — set token';
    }
  }

  $('askBtn').onclick = async () => {
    const q = $('askIn').value.trim();
    if (!q) return;
    const box = $('answer');
    box.style.display = 'block';
    box.textContent = 'Thinking…';
    try {
      const d = await api('/api/ask&q=' + encodeURIComponent(q));
      box.textContent = d.answer || d.error || JSON.stringify(d);
    } catch (e) { box.textContent = 'Error: ' + e.message; }
  };

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
  load(); setInterval(load, 60000);
</script>
</body>
</html>
