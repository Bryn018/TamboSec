name: Deploy Worker (Cloud Run)

on:
  push:
    branches: ["main"]
    paths:
      - "apps/worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-c3ed6666-3a8d-4ef4-a6e
  REGION: europe-west4
  REPOSITORY: tambosec
  SERVICE: tambosec-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/worker/Dockerfile .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "tambosec-runtime@project-c3ed6666-3a8d-4ef4-a6e.iam.gserviceaccount.com" \
            --set-secrets "DATABASE_URL=tambosec-database-url:latest" \
            --set-env-vars "API_BASE=https://tambosec-api-324509025713.europe-west4.run.app,SCHEDULER_ENABLED=1,SCHEDULER_TICK_MS=60000" \
            --min-instances 1 \
            --no-allow-unauthenticated
