name: Poll Telegram

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd bot && npm install
      - run: cd bot && node poll.js single
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_PAT: ${{ secrets.PAT }}
