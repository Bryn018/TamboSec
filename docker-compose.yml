version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tambosec
      POSTGRES_PASSWORD: tambosec
      POSTGRES_DB: tambosec
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pg_data:
