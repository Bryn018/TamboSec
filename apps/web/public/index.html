<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TamboSec Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#04070f;--fg:#def1ff;--muted:#8eb1cb;--line:#243f66;
      --panel:rgba(8,18,36,.7);--panel-glass:rgba(20,35,64,.55);
      --accent:#57d9ff;--violet:#9f7bff;--pink:#ff69b4;
      --critical:#ff3d71;--high:#ff9248;--medium:#ffd56a;--low:#79edc0;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--fg);font-family:Manrope,sans-serif;background:
      radial-gradient(1000px 500px at -10% -10%, rgba(87,217,255,.18), transparent 60%),
      radial-gradient(800px 500px at 110% 0%, rgba(159,123,255,.2), transparent 60%),
      linear-gradient(160deg,#02040a,#050b17 50%,#091427);
      min-height:100vh;
    }
    .noise:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) .6px, transparent .6px);background-size:3px 3px;pointer-events:none;opacity:.17}
    .wrap{max-width:1240px;margin:0 auto;padding:26px}
    .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--panel-glass));box-shadow:0 18px 60px rgba(0,0,0,.35)}
    .brand{font-family:Audiowide,sans-serif;font-size:30px;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),#fff,var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tag{color:var(--muted);margin-top:6px}
    .tenant input{width:340px;max-width:100%}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:14px 0}
    .card{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(13,26,47,.8),rgba(11,20,36,.5));position:relative;overflow:hidden}
    .card:after{content:"";position:absolute;inset:auto -30% -40% -30%;height:120px;background:radial-gradient(circle,rgba(87,217,255,.2),transparent 70%)}
    .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)} .v{font-size:28px;font-weight:700;margin-top:6px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
    button,input{border:1px solid var(--line);background:#091627;color:var(--fg);padding:10px 12px;border-radius:12px}
    button{cursor:pointer;font-weight:700}
    button:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(87,217,255,.2),0 8px 25px rgba(87,217,255,.15)}
    .stack{display:grid;gap:12px}
    .panel{border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(160deg,rgba(10,19,34,.75),rgba(12,24,44,.45));backdrop-filter:blur(6px)}
    h3{margin:4px 0 10px;font-family:Audiowide,sans-serif;font-weight:400;font-size:16px;letter-spacing:.4px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #1a3458;text-align:left;font-size:13px}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:#9ec4e3}
    .sev{font-size:11px;padding:4px 8px;border-radius:999px;font-weight:700;text-transform:uppercase;display:inline-block}
    .critical{background:rgba(255,61,113,.16);color:var(--critical)}
    .high{background:rgba(255,146,72,.16);color:var(--high)}
    .medium{background:rgba(255,213,106,.16);color:var(--medium)}
    .low{background:rgba(121,237,192,.16);color:var(--low)}
    .muted{color:var(--muted)}
    @media (max-width:1060px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:760px){.hero{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:520px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="noise">
  <div class="wrap">
    <div class="hero">
      <div>
        <div class="brand">TamboSec // Fusion Console</div>
        <div class="tag">Art × Security Operations — precise monitoring and controlled remediation</div>
      </div>
      <div class="tenant"><input id="tenantId" placeholder="tenant id" value="tnt_f9fd16fea05a" /></div>
    </div>

    <div class="grid" id="stats"></div>

    <div class="actions">
      <button id="refreshBtn">Refresh</button>
      <button id="scanBtn">Run Posture Scan</button>
      <input id="scheduleHours" type="number" min="1" max="168" value="24" style="width:120px" />
      <button id="scheduleBtn">Set Scan Schedule</button>
    </div>

    <div class="stack">
      <div class="panel">
        <h3>Alert Center (High/Critical)</h3>
        <table><thead><tr><th>Message</th><th>Severity</th><th>Status</th><th>Action</th></tr></thead><tbody id="alertsBody"></tbody></table>
      </div>

      <div class="panel">
        <h3>Findings</h3>
        <table><thead><tr><th>Title</th><th>Severity</th><th>Status</th><th>Source</th></tr></thead><tbody id="findingsBody"></tbody></table>
      </div>

      <div class="panel">
        <h3>Remediation Queue</h3>
        <table><thead><tr><th>Action</th><th>Status</th><th>Finding</th><th>Decision By</th></tr></thead><tbody id="approvalsBody"></tbody></table>
      </div>

      <div class="panel">
        <h3>Recent Audit Events</h3>
        <table><thead><tr><th>Time</th><th>Type</th><th>Actor</th></tr></thead><tbody id="eventsBody"></tbody></table>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    const $ = (id)=>document.getElementById(id);
    const apiBase = window.TAMBOSEC_CONFIG.API_BASE;
    const sevClass = (s)=>({critical:'critical',high:'high',medium:'medium',low:'low'}[s]||'medium');

    async function api(path, opts={}){
      const tenantId = $('tenantId').value.trim();
      const headers = Object.assign({'content-type':'application/json','x-tenant-id':tenantId}, opts.headers||{});
      const res = await fetch(`${apiBase}${path}`, {...opts, headers});
      if(!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function renderStats(findings, approvals, alerts){
      const open = findings.filter(f=>f.status==='open');
      const pending = approvals.filter(a=>a.status==='pending').length;
      const critical = open.filter(f=>f.severity==='critical').length;
      const high = open.filter(f=>f.severity==='high').length;
      const unreadAlerts = alerts.filter(a=>a.status==='unread').length;
      $('stats').innerHTML = [
        ['Open Findings', open.length],
        ['Pending Approvals', pending],
        ['Unread Alerts', unreadAlerts],
        ['Critical', critical],
        ['High', high],
      ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    }

    function renderAlerts(items){
      $('alertsBody').innerHTML = items.map(a=>{
        const ack = a.status === 'unread' ? `<button onclick="ackAlert('${a.id}')">Acknowledge</button>` : '-';
        return `<tr><td>${a.message}</td><td><span class="sev ${sevClass(a.severity)}">${a.severity}</span></td><td>${a.status}</td><td>${ack}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="muted">No active alerts</td></tr>';
    }

    function renderFindings(items){
      $('findingsBody').innerHTML = items.map(f=>`<tr><td>${f.title}</td><td><span class="sev ${sevClass(f.severity)}">${f.severity}</span></td><td>${f.status}</td><td class="muted">${f.source}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No findings</td></tr>';
    }

    function renderApprovals(items){
      $('approvalsBody').innerHTML = items.map(a=>{
        const actionButtons = a.status === 'pending'
          ? `<button onclick="approve('${a.id}')">Approve</button> <button onclick="reject('${a.id}')">Reject</button>`
          : '';
        return `<tr><td>${a.actionType}</td><td>${a.status} ${actionButtons}</td><td class="muted">${a.findingId}</td><td>${a.decisionBy||'-'}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="muted">No approvals</td></tr>';
    }

    function renderEvents(items){
      $('eventsBody').innerHTML = items.slice(0,12).map(e=>`<tr><td>${new Date(e.ts).toLocaleString()}</td><td>${e.type}</td><td>${e.actor||'-'}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No events</td></tr>';
    }

    async function refresh(){
      const [findings, approvals, events, alerts] = await Promise.all([
        api('/v1/findings'), api('/v1/remediations'), api('/v1/audit-events'), api('/v1/alerts')
      ]);
      renderAlerts(alerts.items||[]);
      renderFindings(findings.items||[]);
      renderApprovals(approvals.items||[]);
      renderEvents(events.items||[]);
      renderStats(findings.items||[], approvals.items||[], alerts.items||[]);
    }

    async function approve(id){
      await api(`/v1/remediations/${id}/approve`, { method:'POST', body: JSON.stringify({ decisionBy:'dashboard-user' }) });
      await refresh();
    }

    async function reject(id){
      await api(`/v1/remediations/${id}/reject`, { method:'POST', body: JSON.stringify({ decisionBy:'dashboard-user' }) });
      await refresh();
    }

    async function ackAlert(id){
      await api(`/v1/alerts/${id}/ack`, { method:'POST', body: JSON.stringify({ ackBy:'dashboard-user' }) });
      await refresh();
    }

    window.approve = approve;
    window.reject = reject;
    window.ackAlert = ackAlert;

    $('refreshBtn').onclick = ()=>refresh().catch(e=>alert(e.message));
    $('scanBtn').onclick = async ()=>{
      const tenantId = $('tenantId').value.trim();
      await api('/v1/connectors/google-workspace/posture-scan',{method:'POST',body:JSON.stringify({tenantId,domain:'demo.local'})});
      await refresh();
    };
    $('scheduleBtn').onclick = async ()=>{
      const everyHours = Number($('scheduleHours').value || 24);
      const out = await api('/v1/scans/schedule',{method:'POST',body:JSON.stringify({everyHours, updatedBy:'dashboard-user'})});
      alert(`Scan schedule set: every ${out.schedule.everyHours}h`);
      await refresh();
    };

    refresh().catch(e=>alert(e.message));
  </script>
</body>
</html>
